version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - revive
    - unconvert
  settings:
    revive:
      enable-default-rules: true
      rules:
        # Doc comments are written where they explain a contract, not on
        # every exported name.
        - name: exported
          disabled: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/gtalha07/api-device-management
